<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account aanmaken – Horeca Onboarding Flow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="screen-wrap">
<div class="screen">
<div style="width: 900px; height: 600px; background: #F4F5F7; color: #1B2430; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
<div class="topbar">
  <div class="brand"><img class="brand-mark" src="assets/logo.png" alt="Logo"><div class="brand-name">POSforALL</div></div>
  
  <div style="flex:1"></div>
  <span class="badge badge-proto">Prototype</span>
</div>
<div class="content">
  <h1>Maak je account aan</h1>
  <p class="subtitle">Start meteen je gratis proefperiode van 14 dagen.</p>
  <div style="display:flex;flex-direction:column;gap:16px;max-width:360px;">
    <div class="field"><label for="naam">Naam</label><input id="naam" type="text" placeholder="Voor- en achternaam"></div>
    <div class="field"><label for="email2">E-mailadres</label><input id="email2" type="email" placeholder="jij@zaak.be"></div>
    <div class="field"><label for="zaak">Naam van je zaak</label><input id="zaak" type="text" placeholder="Bv. Bistro De Kroon"></div>
    <div class="field"><label for="pwd2">Wachtwoord</label><input id="pwd2" type="password" placeholder="••••••••"></div>
  </div>
</div>
<div class="footer">
  <a class="back-link" href="voorstel.html">← Terug</a>
  <div class="footer-actions"><a class="btn btn-primary" href="account-welcome.html">Account aanmaken</a></div>
</div>
</div>
</div>
</div>

<script src="assets/responsive.js"></script>
</body>
</html>
