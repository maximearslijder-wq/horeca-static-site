<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landingspagina – Horeca Onboarding Flow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="screen-wrap">
<div class="screen">
<div style="width: 900px; height: 600px; background: #F4F5F7; color: #1B2430; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
<div class="topbar">
  <div class="brand"><img class="brand-mark" src="assets/logo.png" alt="Logo"><div class="brand-name">POSforAll</div></div>
  
  <div style="flex:1"></div>
  
</div>
<div class="content">
  <h1>Welkom bij POSforALL</h1>
  <p class="subtitle">Vertel ons wie je bent, dan brengen we je meteen naar de juiste plek.</p>
  <div class="choice-grid grid-2">
    <a class="choice-card" href="login.html">
      <div class="label">Ik ben klant</div>
      <div class="desc">Log in en beheer het dashboard van je horecazaak.</div>
    </a>
    <a class="choice-card" href="wizard-type.html">
      <div class="label">Ik ben nieuw</div>
      <div class="desc">Beantwoord 4 korte vragen en ontdek welk pakket bij je past.</div>
    </a>
  </div>
</div>
<div class="footer">
  <span></span>
  <div class="footer-actions"><span></span></div>
</div>
</div>
</div>
</div>

<script src="assets/responsive.js"></script>
</body>
</html>
