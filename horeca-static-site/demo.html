<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo plannen – Horeca Onboarding Flow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="screen-wrap">
<div class="screen">
<div style="width: 900px; height: 600px; background: #F4F5F7; color: #1B2430; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
<div class="topbar">
  <div class="brand"><img class="brand-mark" src="assets/logo.png" alt="Logo"><div class="brand-name">POSforALL</div></div>
  
  <div style="flex:1"></div>
  <span class="badge badge-proto">HOMEPAGE</span>
</div>
<div class="content">
  <h1>Plan je demo in</h1>
  <p class="subtitle">Kies een moment dat je uitkomt — een collega van sales belt je op het gekozen tijdstip.</p>
  <div class="chip-grid" id="slot-chips"></div>
  </div>
<div class="footer">
  <a class="back-link" href="voorstel.html">← Terug</a>
  <div class="footer-actions"><a class="btn btn-primary" href="demo-confirm.html">Bevestig demo</a></div>
</div>
</div>
</div>
</div>

<script>
(function(){
  var defs = [
    { id: 'ma', label: 'Ma 14:00' },
    { id: 'di', label: 'Di 10:00' },
    { id: 'wo', label: 'Wo 16:00' },
    { id: 'do', label: 'Do 11:00' },
    { id: 'vr', label: 'Vr 09:00' }
  ];
  var wrap = document.getElementById('slot-chips');
  var buttons = [];
  defs.forEach(function(d){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip';
    btn.textContent = d.label;
    btn.addEventListener('click', function(){
      buttons.forEach(function(b){ b.classList.remove('chip-selected'); });
      btn.classList.add('chip-selected');
    });
    buttons.push(btn);
    wrap.appendChild(btn);
  });
})();
</script>

<script src="assets/responsive.js"></script>
</body>
</html>
