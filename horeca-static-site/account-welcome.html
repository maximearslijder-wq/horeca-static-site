<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account welkom – Horeca Onboarding Flow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css">

<body>
<div class="screen-wrap">

  <span></span>
  <div class="footer-actions"><a class="btn btn-secondary" href="index.html">← Terug naar start</a></div>
